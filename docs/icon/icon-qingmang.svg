<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.06" y1="0" x2="0.94" y2="1">
      <stop offset="0" stop-color="#08C2B6"/>
      <stop offset="0.46" stop-color="#3AD186"/>
      <stop offset="1" stop-color="#A9DC46"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.08" r="0.82">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- ① 半透明白块：与播放三角部分交叠。
       透明度 0.34 才看得出是「一块玻璃」——
       低于 0.2 在渐变底上只会显得渐变不均，缩到桌面尺寸就彻底消失 -->
  <rect x="612" y="576" width="392" height="392" rx="104"
        fill="#FFFFFF" opacity="0.34"
        transform="rotate(-16 808 772)"/>

  <!-- ② 播放三角：纯白，圆角靠 stroke-linejoin:round -->
  <polygon points="322,272 322,752 700,512"
           fill="#FFFFFF" stroke="#FFFFFF"
           stroke-width="60" stroke-linejoin="round"
           transform="rotate(-4 511 512)"/>
</svg>
